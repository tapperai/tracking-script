# Test batch trigger (CI standard 2026-10-17; root CLAUDE.md "GitHub Actions cost" rule 7).
#
# Merges do not wait for tests (CI_GATE_MODE, org Actions variable, NONE today). This workflow starts tests.yml in mode AFFECTED (since 2026-10-23,
# against the last tested sha) every CI_BATCH_SIZE merges (org variable, default 10) on each long-lived branch, nightly (FULL) for any branch
# head not yet tested, and at once for a merge labelled `ci:run-tests` or a commit with the trailer `Tests: run`.
# Logic and the skip record: .github/scripts/ci/batch-trigger.sh.
#
# NO SCHEDULE HERE since T-10669 (2026-10-27): the nightly FULL run moved to loop-prod (loop infra/scripts/nightly-full-tests.sh,
# repos in loop infra/nightly-tests.manifest.json), which raises a red as CI_RED with this repo's tests.yml fingerprint. A
# workflow_dispatch of this trigger still starts a nightly here by hand.
#
# COST: one ubuntu-24.04-arm job of ~15 s per push to a long-lived branch (1 billed minute, $0.005); no nightly job.
name: Test batch trigger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  pull-requests: read

concurrency:
  group: test-batch-trigger-${{ github.ref }}
  cancel-in-progress: false

jobs:
  count:
    name: Count merges since the last test batch
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github/scripts/ci
          persist-credentials: false
      - name: Count, record skips, dispatch tests.yml when due
        env:
          GH_TOKEN: ${{ github.token }}
          CI_BATCH_SIZE: ${{ vars.CI_BATCH_SIZE || '10' }}
          TESTS_WORKFLOW: tests.yml
        run: bash .github/scripts/ci/batch-trigger.sh
