# CI label switch (CI standard 2026-10-17). tests.yml does NOT run on label events: a Loop label (loop:review-*,
# loop:drive) would restart a FULL run, and a skipped run would hide one still running or red. Only the two `ci:`
# labels act, here: adding `ci:run-tests` dispatches the FULL set on the PR head; adding `ci:skip-tests` dispatches a
# NONE run, whose skipped `CI gate` on the head lets the PR merge (the reason goes in a PR comment; the batch still
# covers the merge). Removing either does nothing: the next push runs under CI_GATE_MODE.
# COST: no runner for any other label (job-level if); one ~10 s job per ci: label.
name: CI label switch

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: ${{ github.event.label.name == 'ci:run-tests' || github.event.label.name == 'ci:skip-tests' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
          LABEL: ${{ github.event.label.name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          [ "$SAME_REPO" = true ] || { echo "PR from a fork: no dispatch"; exit 0; }
          if [ "$LABEL" = ci:run-tests ]; then mode=FULL; else mode=NONE; fi
          gh workflow run tests.yml -R "$REPO" --ref "$REF" -f sha="$SHA" -f reason=requested -f mode="$mode"
          echo "dispatched tests.yml on $REF at ${SHA:0:12}, mode $mode" >> "$GITHUB_STEP_SUMMARY"
