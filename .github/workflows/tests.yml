# Tests for this template. A pull request runs the pre-deploy validation (`Validate template`, a required check): it parses
# every section of the template, checks the permission grants and runs the template's own test scenarios, with no network
# and no secrets. A scheduled or manually started run (workflow_dispatch) validates the branch head it was started on.
# A red scheduled run bisects the branch's recent merges and comments on the pull request that introduced the failure.
# Public repository: the job token is read-only, and a dispatch never checks out a commit named by an input.
name: Tests
run-name: "Tests ${{ inputs.sha || github.event.pull_request.head.sha || github.sha }} (${{ inputs.reason || github.event_name }})"

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      sha: { description: "Commit to test (default: the branch head)", required: false, default: "" }
      reason: { description: "batch | nightly | requested | on-demand", required: false, default: "on-demand" }
      mode: { description: "TYPECHECK | AFFECTED | FULL | NONE", required: false, default: "FULL", type: choice, options: [FULL, AFFECTED, TYPECHECK, NONE] }
      base: { description: "AFFECTED only: the commit the change is measured from (default: the sha's first parent)", required: false, default: "" }

# Least privilege: these jobs only read the repo. main is the Gallery release channel, so the job token must never be
# able to write to it.
permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || inputs.sha || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-template:
    # The job name IS a required context (a required check): never rename it.
    name: Validate template.tpl (pre-deploy gate)
    if: ${{ !github.event.pull_request.draft }}
    # python3 (stdlib) and node come with the ARM image; nothing is installed.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not store the job token in .git/config: later steps run template and test code, which must not be able
          # to reuse it.
          persist-credentials: false
          # Full history: --metadata resolves every sha in metadata.yaml and checks the Gallery-served one is an
          # ancestor of HEAD.
          fetch-depth: 0
      - name: Which commit this run tests
        if: github.event_name == 'workflow_dispatch'
        env:
          ASKED: ${{ inputs.sha }}
        run: |
          head="$(git rev-parse HEAD)"
          if [ -n "${ASKED}" ] && [ "${ASKED}" != "${head}" ]; then
            echo "::notice::Asked for ${ASKED}; this run tests the branch head ${head} (public repo: no input-named checkout)."
          fi
      - name: Validate template structure, exact permission grants and the Gallery-served sha
        run: python3 scripts/validate_template.py template.tpl --metadata metadata.yaml
      - name: Run the ___TESTS___ scenarios (GTM permission semantics)
        run: node scripts/run_template_tests.mjs template.tpl
      - name: Run the Custom HTML fallback scenarios
        run: node scripts/run_custom_html_tests.mjs gtm/custom-html-tag.html
      - name: Check the GTM import files match template.tpl and the Custom HTML body
        run: node scripts/build_gtm_container.mjs --check
      # LEAK GUARD: this repo is PUBLIC, so nothing in it may carry an internal name (project ids,
      # instance names, a tapper.ai host that is not on the public list). Plain node over the checkout, about a second,
      # inside this already-required job (no new workflow, no new billed minute). --redact keeps the matched text out of
      # this public log. Canon of the script and its lists: design-system scripts/leak-guard.
      - name: Leak guard (public repo, no internal name)
        run: node scripts/leak-guard/leak-guard.mjs --redact .
      - name: test-changed selection (node --test)
        run: node --test scripts/test-changed.test.mjs

  # THE GATE-MODE CONTEXT (a required check), required beside the pre-deploy check. Skipped under NONE,
  # which GitHub counts as passing. Never rename it, never paths-ignore this workflow.
  gate:
    name: CI gate
    needs: [validate-template]
    if: >-
      ${{ !cancelled() && ((github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call') && (inputs.mode || 'FULL') || contains(github.event.pull_request.labels.*.name, 'ci:skip-tests') && 'NONE' || contains(github.event.pull_request.body, 'Tests: skip') && 'NONE' || contains(github.event.pull_request.body, 'Tests: local') && 'NONE' || github.event.pull_request.draft && 'NONE' || 'NONE') != 'NONE' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 2
    steps:
      - run: |
          echo '${{ toJSON(needs) }}' | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'

  # A red batch or nightly run names the guilty merge (.github/scripts/ci/batch-bisect.sh), re-running the validation
  # at each step.
  bisect:
    name: Bisect the batch
    needs: [validate-template]
    if: ${{ failure() && github.event_name == 'workflow_dispatch' && (inputs.reason == 'batch' || inputs.reason == 'batch-affected' || inputs.reason == 'nightly') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Bisect
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          BAD: ${{ inputs.sha || github.sha }}
          # A batch-affected run was measured from `base`, a PASSED sha on the branch (batch-trigger.sh): that is its good end,
          # not the newest green run of any reason. Any other run: batch-bisect.sh looks one up.
          GOOD: ${{ inputs.reason == 'batch-affected' && inputs.base || '' }}
          GOOD_FULL_ONLY: ${{ inputs.reason == 'nightly' && '1' || '' }}
          # The bisect walks at most the trigger's CI_BATCH_MAX merges (32, test-batch.yml), and ends inside this job's 30
          # minutes with a result that says how far it got.
          BISECT_MAX_MERGES: "32"
          BISECT_BUDGET_MINUTES: "25"
          BISECT_CMD: python3 scripts/validate_template.py template.tpl --metadata metadata.yaml && node scripts/run_template_tests.mjs template.tpl
        run: bash .github/scripts/ci/batch-bisect.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: bisect-result
          path: bisect-result.json
          if-no-files-found: ignore

  # Posts the culprit comment from the bisect job's artifact. No checkout, so it never runs merged code.
  bisect-report:
    name: bisect report
    needs: [bisect]
    if: ${{ !cancelled() && needs.bisect.result == 'success' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    permissions: { pull-requests: write, actions: read }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: bisect-result }
      - env: { GH_TOKEN: "${{ github.token }}", REPO: "${{ github.repository }}", RUN: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" }
        run: |
          pr=$(jq -r '.pr // empty' bisect-result.json); [ "$(jq -r .status bisect-result.json)" = CULPRIT ] && [ -n "$pr" ] || exit 0
          gh pr comment "$pr" -R "$REPO" --body "The test batch at \`$(jq -r .bad bisect-result.json | cut -c1-12)\` on \`$(jq -r .branch bisect-result.json)\` failed; the bisect names this PR's merge \`$(jq -r .culprit_sha bisect-result.json | cut -c1-12)\` as the first bad commit ($RUN). Nothing was reverted automatically; the maintainers will follow up."
