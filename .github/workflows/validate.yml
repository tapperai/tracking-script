name: Validate GTM Template

# This repo has no build/deploy job of its own: the GTM Community Template
# Gallery reads metadata.yaml on the default branch and serves the
# template.tpl of the commit named by its FIRST versions sha (not the branch
# HEAD). Only commits on the default branch can be named there, so the place
# to gate a template change is at PR time and in the merge queue, before it
# lands on the branch Google reads. This job is that gate.
#
# It runs ONLY env-independent checks (python3 stdlib and node, no network,
# no secrets, no npm install) so it can never block a legitimate template change for a
# flaky/credential reason. It validates that every JSON section parses and that
# every global / permission the sandboxed JS actually uses is granted — exactly
# the class of bug (empty access_globals) that previously broke runtime init —
# with the FULL dotted path (GTM matches it exactly), that the version the
# Gallery serves (first sha in metadata.yaml) is this template, and runs the
# template's own ___TESTS___ scenarios (node, no npm install).
#
# Triggers (CI cost and speed standard, 2026-10-14): a ready PR and the merge
# queue. main takes changes only through the merge queue (ruleset
# merge-queue-main), so the queue run validates the exact merge commit that
# lands; the old post-merge push run re-checked that same commit and is gone.
# Draft PRs run nothing: the job is skipped, and a skipped job reports the
# required context as passing, so a draft never deadlocks. Marking the PR
# ready starts the real run. The suite is seconds long, so there is no scope
# step and no sharding: the job bills one minute either way.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  merge_group:
    types: [checks_requested]

# Least privilege: this job only reads the repo. main is the Gallery release
# channel, so the job token must never be able to write to it.
permissions:
  contents: read

# A newer push to the same PR cancels the older run; a merge-queue run has its
# own ref per group and is never cancelled by a PR push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-template:
    # The job name IS the required status check of classic branch protection
    # on main: never rename it.
    name: Validate template.tpl (pre-deploy gate)
    if: github.event.pull_request.draft != true
    # python3 (stdlib) and node come with the ARM image; nothing is installed.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not store the job token in .git/config: later steps run
          # template and test code, which must not be able to reuse it.
          persist-credentials: false
          # Full history: --metadata resolves every sha in metadata.yaml and
          # checks the Gallery-served one is an ancestor of HEAD.
          fetch-depth: 0
      - name: Validate template structure, exact permission grants and the Gallery-served sha
        run: python3 scripts/validate_template.py template.tpl --metadata metadata.yaml
      - name: Run the ___TESTS___ scenarios (GTM permission semantics)
        run: node scripts/run_template_tests.mjs template.tpl
