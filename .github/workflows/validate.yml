name: Validate GTM Template

# This repo has no build/deploy job of its own: the GTM Community Template
# Gallery reads metadata.yaml on the default branch and serves the
# template.tpl of the commit named by its FIRST versions sha (not the branch
# HEAD). Only commits on the default branch can be named there, so the place
# to gate a template change is at PR time (and on push), before it lands on
# the branch Google reads. This job is that gate.
#
# It runs ONLY env-independent checks (pure python3 stdlib, no network, no
# secrets, no npm) so it can never block a legitimate template change for a
# flaky/credential reason. It validates that every JSON section parses and that
# every global / permission the sandboxed JS actually uses is granted — exactly
# the class of bug (empty access_globals) that previously broke runtime init.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-template:
    name: Validate template.tpl (pre-deploy gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate template structure and permission grants
        run: python3 scripts/validate_template.py template.tpl
